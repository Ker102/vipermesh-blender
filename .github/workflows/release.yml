name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check
      - run: python -m py_compile addon/vipermesh-addon.py
      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp addon/vipermesh-addon.py "release/vipermesh-for-blender-addon-${GITHUB_REF_NAME}.py"
          npm pack --pack-destination release
          (cd addon && zip "../release/vipermesh-for-blender-addon-${GITHUB_REF_NAME}.zip" vipermesh-addon.py)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
